<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <meta name="theme-color" content="#1a7fb3">
    <title>EDITOR PERSONAL - ¿QUIÉN SOY?</title>
    
    <!-- Fuentes -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(145deg, #6fc3df 0%, #4a9fc7 30%, #1a7fb3 70%, #0a4f7a 100%);
            color: #e0f2ff;
            font-family: 'VT323', monospace;
            min-height: 100vh;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: repeating-linear-gradient(0deg, rgba(255,255,255,0.1) 0px, rgba(255,255,255,0.1) 2px, transparent 2px, transparent 8px);
            pointer-events: none;
            z-index: 0;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1rem;
            position: relative;
            z-index: 2;
        }
        
        /* HEADER */
        .header-editor {
            background: rgba(40, 120, 180, 0.7);
            backdrop-filter: blur(2px);
            border: 4px solid #9fd9ff;
            padding: 1rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 8px 0 #0a4f7a;
        }
        
        .logo {
            font-family: 'Press Start 2P', cursive;
            font-size: 1.2rem;
            color: #ffffff;
            text-shadow: 3px 3px 0 #0a4f7a;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .logo i {
            color: #ffd700;
            animation: rotar 10s linear infinite;
        }
        
        @keyframes rotar {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        /* PESTAÑAS */
        .tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        
        .tab-btn {
            font-family: 'Press Start 2P', cursive;
            font-size: 0.7rem;
            padding: 0.8rem 1.5rem;
            background: rgba(20, 80, 140, 0.8);
            border: 3px solid #9fd9ff;
            color: #e0f2ff;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 0 #0a4f7a;
        }
        
        .tab-btn.active {
            background: #1a7fb3;
            transform: translateY(2px);
            box-shadow: 0 2px 0 #0a4f7a;
            border-color: #ffffff;
        }
        
        .tab-btn:hover {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #0a4f7a;
        }
        
        /* PANELES */
        .panel {
            display: none;
            animation: aparecer 0.3s ease;
        }
        
        .panel.active {
            display: block;
        }
        
        @keyframes aparecer {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* EDITOR */
        .editor-area {
            background: rgba(10, 50, 90, 0.8);
            border: 4px solid #9fd9ff;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 8px 0 #0a4f7a;
        }
        
        .campo-editor {
            margin-bottom: 1.5rem;
        }
        
        .campo-label {
            font-family: 'Press Start 2P', cursive;
            font-size: 0.7rem;
            color: #ffd700;
            margin-bottom: 0.5rem;
            display: block;
        }
        
        .campo-input, .campo-textarea {
            width: 100%;
            background: #0a4f7a;
            border: 3px solid #4a9fc7;
            padding: 0.8rem;
            color: white;
            font-family: 'VT323', monospace;
            font-size: 1rem;
        }
        
        .campo-textarea {
            resize: vertical;
            min-height: 150px;
        }
        
        .campo-input:focus, .campo-textarea:focus {
            outline: none;
            border-color: #ffd700;
        }
        
        /* TOOLBAR */
        .toolbar {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
            padding: 1rem;
            background: rgba(30, 100, 160, 0.8);
            border: 3px solid #4a9fc7;
        }
        
        .tool-btn {
            background: #1a5f8f;
            border: 3px solid #4a9fc7;
            color: white;
            padding: 0.6rem 1rem;
            cursor: pointer;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.6rem;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }
        
        .tool-btn:hover {
            transform: scale(0.95);
            background: #2f7faf;
        }
        
        .tool-btn.exportar {
            background: #2f9f5f;
            border-color: #6fcf9f;
        }
        
        .tool-btn.preview {
            background: #bf8f2f;
            border-color: #ffd700;
        }
        
        /* PREVISUALIZACIÓN */
        .preview-area {
            background: rgba(10, 50, 90, 0.6);
            border: 4px solid #9fd9ff;
            padding: 2rem;
            min-height: 500px;
            box-shadow: 0 8px 0 #0a4f7a;
        }
        
        /* ESTILOS DE LA PÁGINA PERSONAL */
        .pagina-personal {
            background: rgba(20, 80, 140, 0.8);
            padding: 2rem;
            color: #e0f2ff;
            font-family: 'VT323', monospace;
        }
        
        .pagina-personal h1 {
            font-family: 'Press Start 2P', cursive;
            font-size: 1.8rem;
            color: #ffd700;
            text-align: center;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 0 #0a4f7a;
        }
        
        .pagina-personal .avatar {
            text-align: center;
            margin: 1.5rem 0;
        }
        
        .pagina-personal .avatar-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 4px solid #ffd700;
            object-fit: cover;
            background: #0a4f7a;
        }
        
        .pagina-personal .avatar-placeholder {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 4px solid #ffd700;
            background: linear-gradient(145deg, #ff6600, #ff3300);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            margin: 0 auto;
        }
        
        .pagina-personal .bio {
            background: rgba(10, 50, 90, 0.6);
            padding: 1.5rem;
            border-left: 6px solid #ffd700;
            margin: 1.5rem 0;
            font-size: 1.2rem;
            line-height: 1.6;
        }
        
        .pagina-personal .seccion {
            margin: 2rem 0;
        }
        
        .pagina-personal .seccion-titulo {
            font-family: 'Press Start 2P', cursive;
            font-size: 0.9rem;
            color: #ffd700;
            border-bottom: 3px solid #9fd9ff;
            padding-bottom: 0.5rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .pagina-personal .skills {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
        }
        
        .pagina-personal .skill-tag {
            background: #1a7fb3;
            border: 2px solid #9fd9ff;
            padding: 0.5rem 1rem;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.6rem;
        }
        
        .pagina-personal .redes {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .pagina-personal .red-link {
            background: #0a4f7a;
            border: 3px solid #9fd9ff;
            padding: 0.8rem 1.5rem;
            color: white;
            text-decoration: none;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.7rem;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .pagina-personal .red-link:hover {
            transform: translateY(-3px);
            background: #1a7fb3;
            border-color: #ffd700;
        }
        
        .pagina-personal .galeria {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 1rem;
        }
        
        .pagina-personal .galeria-img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border: 3px solid #9fd9ff;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .pagina-personal .galeria-img:hover {
            transform: scale(1.05);
            border-color: #ffd700;
        }
        
        /* GALERÍA DE IMÁGENES */
        .galeria-editor {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }
        
        .galeria-item {
            position: relative;
            background: #0a4f7a;
            border: 3px solid #4a9fc7;
            padding: 0.5rem;
        }
        
        .galeria-item img {
            width: 100%;
            height: 100px;
            object-fit: cover;
        }
        
        .galeria-item .delete-img {
            position: absolute;
            top: -10px;
            right: -10px;
            background: #8f2f2f;
            border: 2px solid #ff6f6f;
            color: white;
            width: 25px;
            height: 25px;
            cursor: pointer;
            font-size: 0.7rem;
        }
        
        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #1a5f8f;
            border: 6px solid #9fd9ff;
            padding: 2rem;
            z-index: 1000;
            max-width: 90%;
            width: 500px;
            box-shadow: 12px 12px 0 #0a3f5f;
        }
        
        .modal.active {
            display: block;
            animation: aparecerModal 0.3s ease;
        }
        
        @keyframes aparecerModal {
            from { opacity: 0; transform: translate(-50%, -40%); }
            to { opacity: 1; transform: translate(-50%, -50%); }
        }
        
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 30, 60, 0.9);
            z-index: 999;
        }
        
        .modal-overlay.active {
            display: block;
        }
        
        .mensaje {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a5f8f;
            border: 4px solid #9fd9ff;
            padding: 1rem 2rem;
            z-index: 1001;
            animation: slideUp 0.3s ease;
        }
        
        @keyframes slideUp {
            from { bottom: -100px; }
            to { bottom: 20px; }
        }
        
        /* RESPONSIVE */
        @media (max-width: 768px) {
            .logo { font-size: 0.8rem; }
            .tab-btn { font-size: 0.5rem; padding: 0.5rem 1rem; }
            .tool-btn { font-size: 0.5rem; padding: 0.4rem 0.8rem; }
            .pagina-personal h1 { font-size: 1.2rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- HEADER -->
        <div class="header-editor">
            <div class="logo">
                <i class="fas fa-user-astronaut"></i>
                EDITOR PERSONAL - ¿QUIÉN SOY?
            </div>
        </div>
        
        <!-- PESTAÑAS -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="editor">✏️ EDITAR</button>
            <button class="tab-btn" data-tab="preview">👁️ PREVISUALIZAR</button>
            <button class="tab-btn" data-tab="galeria">🖼️ GALERÍA</button>
            <button class="tab-btn" data-tab="exportar">📤 EXPORTAR</button>
        </div>
        
        <!-- PANEL EDITOR -->
        <div class="panel active" id="panel-editor">
            <div class="editor-area">
                <div class="campo-editor">
                    <label class="campo-label"><i class="fas fa-user"></i> NOMBRE / TÍTULO</label>
                    <input type="text" id="nombre" class="campo-input" placeholder="Ej: Nere1d - Creador de NERUME">
                </div>
                
                <div class="campo-editor">
                    <label class="campo-label"><i class="fas fa-smile"></i> FRASE / LEMA</label>
                    <input type="text" id="frase" class="campo-input" placeholder="Ej: Sumérgete en mi mundo creativo">
                </div>
                
                <div class="campo-editor">
                    <label class="campo-label"><i class="fas fa-align-left"></i> BIOGRAFÍA</label>
                    <textarea id="bio" class="campo-textarea" rows="5" placeholder="Cuéntame quién eres, qué haces, tus pasiones..."></textarea>
                </div>
                
                <div class="campo-editor">
                    <label class="campo-label"><i class="fas fa-cogs"></i> HABILIDADES / INTERESES (separadas por coma)</label>
                    <input type="text" id="skills" class="campo-input" placeholder="Ej: Desarrollo web, Minecraft, Pixel Art, Música">
                </div>
                
                <div class="campo-editor">
                    <label class="campo-label"><i class="fas fa-link"></i> REDES SOCIALES</label>
                    <div style="display: grid; gap: 0.5rem;">
                        <input type="text" id="red-twitter" class="campo-input" placeholder="Twitter/X - URL">
                        <input type="text" id="red-github" class="campo-input" placeholder="GitHub - URL">
                        <input type="text" id="red-instagram" class="campo-input" placeholder="Instagram - URL">
                        <input type="text" id="red-discord" class="campo-input" placeholder="Discord - URL o usuario">
                        <input type="text" id="red-youtube" class="campo-input" placeholder="YouTube - URL">
                    </div>
                </div>
            </div>
            
            <div class="toolbar">
                <button class="tool-btn" id="btn-avatar" onclick="subirAvatar()"><i class="fas fa-camera"></i> SUBIR AVATAR</button>
                <button class="tool-btn" id="btn-fondo" onclick="subirFondo()"><i class="fas fa-image"></i> SUBIR FONDO</button>
                <button class="tool-btn preview" id="btn-preview-editor" onclick="irAPreview()"><i class="fas fa-eye"></i> VER PREVISUALIZACIÓN</button>
            </div>
        </div>
        
        <!-- PANEL PREVISUALIZACIÓN -->
        <div class="panel" id="panel-preview">
            <div class="preview-area" id="preview-contenedor"></div>
            <div class="toolbar" style="margin-top: 1rem;">
                <button class="tool-btn" onclick="irAEditor()"><i class="fas fa-arrow-left"></i> VOLVER A EDITAR</button>
                <button class="tool-btn exportar" onclick="irAExportar()"><i class="fas fa-download"></i> EXPORTAR HTML</button>
            </div>
        </div>
        
        <!-- PANEL GALERÍA -->
        <div class="panel" id="panel-galeria">
            <div class="editor-area">
                <div class="toolbar">
                    <button class="tool-btn" id="btn-subir-galeria" onclick="subirImagenGaleria()"><i class="fas fa-plus"></i> SUBIR IMAGEN</button>
                    <button class="tool-btn" onclick="actualizarGaleria()"><i class="fas fa-sync"></i> ACTUALIZAR</button>
                </div>
                <div id="galeria-lista" class="galeria-editor">
                    <p style="text-align: center; padding: 2rem;">No hay imágenes. Sube tus primeras fotos!</p>
                </div>
            </div>
        </div>
        
        <!-- PANEL EXPORTAR -->
        <div class="panel" id="panel-exportar">
            <div class="editor-area">
                <div class="toolbar">
                    <button class="tool-btn exportar" id="btn-exportar-html" onclick="exportarHTML()"><i class="fas fa-file-code"></i> EXPORTAR COMO HTML</button>
                    <button class="tool-btn" id="btn-copiar-codigo" onclick="copiarCodigo()"><i class="fas fa-copy"></i> COPIAR CÓDIGO</button>
                </div>
                <textarea id="codigo-exportado" class="campo-textarea" rows="15" readonly style="font-family: monospace; font-size: 0.8rem;"></textarea>
                <p style="margin-top: 1rem; color: #ffd700;"><i class="fas fa-info-circle"></i> Copia este código y pégalo en un archivo .html para compartir tu página personal</p>
            </div>
        </div>
    </div>
    
    <!-- MODAL AVATAR -->
    <div class="modal-overlay" id="modal-overlay"></div>
    <div class="modal" id="modal-avatar">
        <h3 style="color: #ffd700; margin-bottom: 1rem;"><i class="fas fa-camera"></i> SUBIR AVATAR</h3>
        <input type="file" id="avatar-file" accept="image/*" style="width: 100%; background: #0a4f7a; border: 3px solid #4a9fc7; padding: 0.5rem; color: white;">
        <div style="display: flex; gap: 1rem; margin-top: 1rem;">
            <button class="tool-btn" onclick="subirAvatarConfirmar()">SUBIR</button>
            <button class="tool-btn" onclick="cerrarModal()">CANCELAR</button>
        </div>
    </div>
    
    <!-- MODAL FONDO -->
    <div class="modal" id="modal-fondo">
        <h3 style="color: #ffd700; margin-bottom: 1rem;"><i class="fas fa-image"></i> SUBIR FONDO</h3>
        <input type="file" id="fondo-file" accept="image/*" style="width: 100%; background: #0a4f7a; border: 3px solid #4a9fc7; padding: 0.5rem; color: white;">
        <div style="display: flex; gap: 1rem; margin-top: 1rem;">
            <button class="tool-btn" onclick="subirFondoConfirmar()">SUBIR</button>
            <button class="tool-btn" onclick="cerrarModal()">CANCELAR</button>
        </div>
    </div>
    
    <script>
        // ================= VARIABLES =================
        let datosPagina = {
            nombre: "Nere1d - Creador",
            frase: "Sumérgete en mi mundo creativo",
            bio: "Hola! Soy creador de NERUME, una comunidad donde la creatividad y los juegos se unen. Me encanta el pixel art, la música y los servidores de Minecraft.",
            skills: ["Desarrollo Web", "Pixel Art", "Minecraft", "Música"],
            avatar: null,
            fondo: null,
            galeria: [],
            redes: {
                twitter: "",
                github: "",
                instagram: "",
                discord: "",
                youtube: ""
            }
        };
        
        // ================= FUNCIONES DE ALMACENAMIENTO =================
        function guardarLocal() {
            // Guardar texto
            datosPagina.nombre = document.getElementById('nombre').value || "Mi Página Personal";
            datosPagina.frase = document.getElementById('frase').value || "";
            datosPagina.bio = document.getElementById('bio').value || "";
            
            // Guardar skills
            const skillsInput = document.getElementById('skills').value;
            if (skillsInput) {
                datosPagina.skills = skillsInput.split(',').map(s => s.trim()).filter(s => s);
            }
            
            // Guardar redes
            datosPagina.redes.twitter = document.getElementById('red-twitter').value;
            datosPagina.redes.github = document.getElementById('red-github').value;
            datosPagina.redes.instagram = document.getElementById('red-instagram').value;
            datosPagina.redes.discord = document.getElementById('red-discord').value;
            datosPagina.redes.youtube = document.getElementById('red-youtube').value;
            
            // Guardar en localStorage
            localStorage.setItem('pagina_personal', JSON.stringify(datosPagina));
        }
        
        function cargarLocal() {
            const guardado = localStorage.getItem('pagina_personal');
            if (guardado) {
                try {
                    const cargado = JSON.parse(guardado);
                    datosPagina = { ...datosPagina, ...cargado };
                    
                    // Cargar inputs
                    document.getElementById('nombre').value = datosPagina.nombre || "";
                    document.getElementById('frase').value = datosPagina.frase || "";
                    document.getElementById('bio').value = datosPagina.bio || "";
                    document.getElementById('skills').value = datosPagina.skills ? datosPagina.skills.join(', ') : "";
                    document.getElementById('red-twitter').value = datosPagina.redes?.twitter || "";
                    document.getElementById('red-github').value = datosPagina.redes?.github || "";
                    document.getElementById('red-instagram').value = datosPagina.redes?.instagram || "";
                    document.getElementById('red-discord').value = datosPagina.redes?.discord || "";
                    document.getElementById('red-youtube').value = datosPagina.redes?.youtube || "";
                    
                    actualizarGaleria();
                } catch(e) {}
            }
        }
        
        // ================= SUBIR AVATAR =================
        function subirAvatar() {
            document.getElementById('modal-overlay').classList.add('active');
            document.getElementById('modal-avatar').classList.add('active');
        }
        
        function subirAvatarConfirmar() {
            const file = document.getElementById('avatar-file').files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    datosPagina.avatar = e.target.result;
                    guardarLocal();
                    mostrarMensaje('✅ Avatar actualizado');
                    cerrarModal();
                    if (document.getElementById('panel-preview').classList.contains('active')) {
                        actualizarPreview();
                    }
                };
                reader.readAsDataURL(file);
            }
            document.getElementById('avatar-file').value = '';
        }
        
        // ================= SUBIR FONDO =================
        function subirFondo() {
            document.getElementById('modal-overlay').classList.add('active');
            document.getElementById('modal-fondo').classList.add('active');
        }
        
        function subirFondoConfirmar() {
            const file = document.getElementById('fondo-file').files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    datosPagina.fondo = e.target.result;
                    guardarLocal();
                    mostrarMensaje('✅ Fondo actualizado');
                    cerrarModal();
                    if (document.getElementById('panel-preview').classList.contains('active')) {
                        actualizarPreview();
                    }
                };
                reader.readAsDataURL(file);
            }
            document.getElementById('fondo-file').value = '';
        }
        
        // ================= SUBIR IMAGEN GALERÍA =================
        function subirImagenGaleria() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.onchange = function(e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(ev) {
                        datosPagina.galeria.push(ev.target.result);
                        guardarLocal();
                        actualizarGaleria();
                        mostrarMensaje('✅ Imagen agregada a la galería');
                    };
                    reader.readAsDataURL(file);
                }
            };
            input.click();
        }
        
        function eliminarImagenGaleria(index) {
            if (confirm('¿Eliminar esta imagen?')) {
                datosPagina.galeria.splice(index, 1);
                guardarLocal();
                actualizarGaleria();
                mostrarMensaje('✅ Imagen eliminada');
            }
        }
        
        function actualizarGaleria() {
            const contenedor = document.getElementById('galeria-lista');
            if (!contenedor) return;
            
            if (datosPagina.galeria.length === 0) {
                contenedor.innerHTML = '<p style="text-align: center; padding: 2rem;">📭 No hay imágenes. Sube tus primeras fotos!</p>';
                return;
            }

            a.href = url;
